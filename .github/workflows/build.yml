name: Build
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
jobs:
  Build:
    if: github.repository == 'YourRepositoryNameHere'
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Perform commit linting
        uses: wagoid/commitlint-github-action@v6
