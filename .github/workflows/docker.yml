name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches:
      - updated-measurements

jobs:
  PushDockerImage:
    name: Push Docker Image - ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          - name: Smart Factory Service
            context: benchmark-s1/smart-factory-service
            image: smartfactoryservice

          - name: Metrics Collector
            context: benchmark-s1/metrics-collector
            image: smartfactorycollector

          - name: Event Publisher
            context: benchmark-s1/event-publisher
            image: smartfactoryep

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aryanp281/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}