name: Publish Docker image

on:
  push:
    branches: ["test-ci"]
  workflow_dispatch:

jobs:
  PushDockerImage:
    name: Push Docker Image - ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: Smart Factory Service
            context: benchmark-s1/smart-factory-service
            image: ghcr.io/aryanp281/smartfactoryservice

          - name: Metrics Collector
            context: benchmark-s1/metrics-collector
            image: ghcr.io/aryanp281/smartfactorycollector

          - name: Event Publisher
            context: benchmark-s1/event-publisher
            image: ghcr.io/aryanp281/smartfactoryep

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=test
            type=sha
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
